<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G_bt14</title>
<link rel="icon" type="image/png" href="Dith_gab.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

/* LOADER */

#loader{
position:fixed;
width:100%;
height:100vh;
background:#000000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#loader img{
width:100px;
animation:logoOpen 2.5s ease forwards;
}

@keyframes logoOpen{
0%{transform:scale(.5);opacity:0;}
50%{transform:scale(1.2);opacity:1;}
100%{transform:scale(20);opacity:0;}
}

.loader-hidden{
animation:slideUp 1s ease forwards;
}

@keyframes slideUp{
to{transform:translateY(-100%);opacity:0;}
}

/* BACKGROUND */

.container{
width:100%;
height: 100vh;
min-height:fit-content;
background:#000000;
display:flex;
flex-direction:column;
align-items:center;
padding:40px;
}

/* LANDING */

#landing{
opacity:0;
transition:opacity 1.5s ease;
width:100%;
max-width:1400px;
position:relative;
z-index:1;
}

#landing.show{
opacity:1;
}

#landing::before{
content:"";
position:absolute;
inset:0;
background-image:radial-gradient(circle at 1px 1px, rgb(243, 243, 243) 1px, transparent 0);
background-size:25px 25px;
animation:movePattern 40s linear infinite;
z-index:-1;
}

@keyframes movePattern{
from{background-position:0 0;}
to{background-position:500px 500px;}
}

/* CARD */

.card{
width:min(300px,100%);
max-height: fit-content;
background:#cb0c0c;
border:3px solid #000;
box-shadow:12px 12px 0 #000;
overflow:hidden;
transform:translate(-6px,-6px);
transition:.2s;
}

.card:hover{
transform:translate(-10px,-10px);
box-shadow:16px 16px 0 #000;
}

.head{
font-size:14px;
font-weight:900;
background:#fff;
padding:5px 12px;
border-bottom:3px solid #000;
}

.content{
padding:8px 12px;
}

/* BUTTON */

.button{
padding:5px 10px;
border:3px solid #000;
box-shadow:3px 3px 0 #000;
background:#072965;
cursor:pointer;
transition:.15s;
}

.button:hover{
transform:translate(2px,2px);
box-shadow:1px 1px 0 #000;
background:#1ac2ff;
}
/* DROPDOWN */

.dropdown-title{
cursor:pointer;
user-select:none;
transition:.2s;
overflow-wrap:break-word;
}
@media (max-width:768px){
    .dropdown-title{
        text-align:center;
    }
}

.dropdown-title:hover{
opacity:.7;
}

.dropdown-content{
max-height:0;
overflow:hidden;
transition:max-height .5s ease;
background-image:radial-gradient(circle at 1px 1px, rgb(6, 64, 164) 1px, transparent 0);
background-size:25px 25px;
animation:movePattern 40s linear infinite;
z-index:-1;
}

.dropdown-content.open{
max-height:10000px;

}

/* PORTFOLIO LAYOUT */

#portfolio{
margin-top:40px;
width:100%;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.column{
width:100%;
}

/* VIDEO GRID */

.videoWrapper{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:30px;
margin:15px auto;
width:100%;
max-width:900px;
justify-items:center;
}
.videoWrapper video{
    display:block;
    width:100%;
    height:auto;
    max-width:100%;
}
@media (max-width:768px){
    .videoWrapper{
        grid-template-columns:1fr;
        gap:20px;
    }
}
/*PAGE TOGGLE */
/* PAGE TOGGLE */

.page-toggle{
position:fixed;
bottom:20px;
right:20px;
display:flex;
align-items:center;
gap:10px;
background:rgba(0,0,0,0.75);
padding:10px 14px;
border:3px solid #000;
box-shadow:6px 6px 0 #000;
border-radius:999px;
z-index:9998;
}

.toggle-label{
color:#fff;
font-weight:900;
font-size:12px;
letter-spacing:1px;
}

.switch{
position:relative;
display:inline-block;
width:56px;
height:30px;
}

.switch input{
opacity:0;
width:0;
height:0;
}

.slider{
position:absolute;
cursor:pointer;
inset:0;
background:#555;
transition:.25s;
border:3px solid #000;
border-radius:999px;
}

.slider:before{
content:"";
position:absolute;
height:18px;
width:18px;
left:4px;
top:3px;
background:#fff;
border:2px solid #000;
border-radius:50%;
transition:.25s;
}

.switch input:checked + .slider{
background:#4ade80;
}

.switch input:checked + .slider:before{
transform:translateX(24px);
}

</style>
</head>
<!-- PAGE TOGGLE -->
<div class="page-toggle">
  <span class="toggle-label"></span>
  <label class="switch">
    <input type="checkbox" id="pageSwitch">
    <span class="slider"></span>
  </label>
  <span class="toggle-label">WC</span>
</div>
<body>

<div id="loader">
<img src="gbt.14.png">
</div>

<div class="container">

<div id="landing">

<div class="card">
<div class="head">Welcome!</div>

<div class="content">
Welcome to G_bt14 Productions!

<br><br>

<button class="button"><i class="fa-brands fa-instagram"></i></button>
<button class="button"><i class="fa-brands fa-tiktok"></i></button>

</div>
</div>
<div id="portfolio">
    <div id="leaguesColumn" class="column"></div>
</div>
</div>
</div>

<script>

    /* LOADER */
    
    window.addEventListener("load",()=>{
    
    setTimeout(()=>{
    
    const loader=document.getElementById("loader");
    
    loader.classList.add("loader-hidden");
    
    document.getElementById("landing").classList.add("show");
    
    setTimeout(()=>loader.style.display="none",1000);
    
    },2500)
    
    })
    /* DATA */
    const videoData ={
        "WC26":{
            "GROUP STAGE":{
                MATCHDAY1:[
                    {title:"Opening games",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/MD1.mp4"},
                    {title:"USA",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/USA.mp4"},
                    {title:"GOALS",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/MD1GOALS.mp4"}
                ],
                MATCHDAY2:[
                    {title:"GOALS",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/MATCHDAY2.mp4"}

                ],
                MATCHDAY3:[
                    {title:"GOALS",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/MD3.mp4"}

                ]
            },
            "MORE":{
                INTRODUCTION:[
                    {title:"INTRO",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/WC(INTRODUCTION).mp4"}
                ],
                MESSI:[
                    {title:"MESSI",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/MESSI.mp4"}

                ],
                RONALDO:[
                    {title:"RONALDO",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/RONALDO.mp4"}

                ],
                "LEADERS OF TOMORROW":[
                    {title:"Leaders of tomorrow",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/LEADERS%20OF%20TOMORROW.mp4"}

                ],
                "FRANCE VS ENGLAND":[
                    {title:"3rd place playoff",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/FRAVSENGLAND.mp4"}

                ],
                WISSA:[
                    {title:"WISSA",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/WISSA.mp4"}
                ],
              KEEPERS:[
                    {title:"KEEPERS",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/KEEPERS.mp4"}
              ],
              WONDERWALL:[
                {title:"WONDERWALL",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/WONDERWALL.mp4"}
              ],
              LUKAKU:[
                {title:"LUKAKU!!!",file:"https://storage.cloud.google.com/vidoes_assets/web%20applications/videos/WC26/LUKAKU.mp4"}
              ]

            }
        }

    }
    /* RENDER FUNCTION */
    function renderPortfolio() {
    const leaguesColumn = document.getElementById("leaguesColumn");

    leaguesColumn.innerHTML = "";

    let openLeague = null;
    let openTeam = null;

    // LEAGUES (WC26)
    for (let league in videoData) {

        const leagueTitle = document.createElement("h2");
        leagueTitle.textContent = league + " ▼";
        leagueTitle.style.color = "white";
        leagueTitle.classList.add("dropdown-title");

        const leagueContainer = document.createElement("div");
        leagueContainer.classList.add("dropdown-content");

        leaguesColumn.appendChild(leagueTitle);
        leaguesColumn.appendChild(leagueContainer);

        leagueTitle.onclick = () => {
            if (openLeague && openLeague !== leagueContainer) {
                openLeague.classList.remove("open");
            }

            leagueContainer.classList.toggle("open");
            openLeague = leagueContainer;
        };

        // TEAMS / SECTIONS (GROUP STAGE, MORE)
        for (let team in videoData[league]) {

            const teamTitle = document.createElement("h3");
            teamTitle.textContent = team + " ▶";
            teamTitle.style.color = "#4ade80";
            teamTitle.classList.add("dropdown-title");

            const teamContainer = document.createElement("div");
            teamContainer.classList.add("dropdown-content");

            leagueContainer.appendChild(teamTitle);
            leagueContainer.appendChild(teamContainer);

            teamTitle.onclick = () => {
                if (openTeam && openTeam !== teamContainer) {
                    openTeam.classList.remove("open");
                }

                teamContainer.classList.toggle("open");
                openTeam = teamContainer;
            };

            // SUBSECTIONS (MATCHDAY1, MESSI, etc.)
            for (let category in videoData[league][team]) {

                const categoryTitle = document.createElement("h4");
                categoryTitle.textContent = category;
                categoryTitle.style.color = "#fff";
                categoryTitle.style.margin = "15px 0 10px";

                teamContainer.appendChild(categoryTitle);

                const wrapper = document.createElement("div");
                wrapper.className = "videoWrapper";

                videoData[league][team][category].forEach(video => {

                    const card = document.createElement("div");
                    card.className = "card";

                    card.innerHTML = `
                        <div class="head">${video.title}</div>
                        <div class="content">
                            <video width="100%" controls preload="metadata">
                                <source src="${video.file}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    `;

                    wrapper.appendChild(card);

                });

                teamContainer.appendChild(wrapper);
            }
        }
    }
}

renderPortfolio();
const pageSwitch = document.getElementById("pageSwitch");

// World Cup page = ON
pageSwitch.checked = true;

pageSwitch.addEventListener("change", () => {
    window.location.href = "index.html";
});
</script>
</body>
</html>
