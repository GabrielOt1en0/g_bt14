<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

/* LOADER */

#loader{
position:fixed;
width:100%;
height:100vh;
background:#000000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#loader img{
width:100px;
animation:logoOpen 2.5s ease forwards;
}

@keyframes logoOpen{
0%{transform:scale(.5);opacity:0;}
50%{transform:scale(1.2);opacity:1;}
100%{transform:scale(20);opacity:0;}
}

.loader-hidden{
animation:slideUp 1s ease forwards;
}

@keyframes slideUp{
to{transform:translateY(-100%);opacity:0;}
}

/* BACKGROUND */

.container{
width:100%;
height: 100vh;
min-height:fit-content;
background:#121212;
display:flex;
flex-direction:column;
align-items:center;
padding:40px;
}

/* LANDING */

#landing{
opacity:0;
transition:opacity 1.5s ease;
width:100%;
position:relative;
z-index:1;
}

#landing.show{
opacity:1;
}

#landing::before{
content:"";
position:absolute;
inset:0;
background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.08) 1px, transparent 0);
background-size:25px 25px;
animation:movePattern 40s linear infinite;
z-index:-1;
}

@keyframes movePattern{
from{background-position:0 0;}
to{background-position:500px 500px;}
}

/* CARD */

.card{
width:300px;
max-height: fit-content;
background:#ff66a3;
border:3px solid #000;
box-shadow:12px 12px 0 #000;
overflow:hidden;
transform:translate(-6px,-6px);
transition:.2s;
}

.card:hover{
transform:translate(-10px,-10px);
box-shadow:16px 16px 0 #000;
}

.head{
font-size:14px;
font-weight:900;
background:#fff;
padding:5px 12px;
border-bottom:3px solid #000;
}

.content{
padding:8px 12px;
}

/* BUTTON */

.button{
padding:5px 10px;
border:3px solid #000;
box-shadow:3px 3px 0 #000;
background:#4ade80;
cursor:pointer;
transition:.15s;
}

.button:hover{
transform:translate(2px,2px);
box-shadow:1px 1px 0 #000;
background:#1ac2ff;
}

/* DROPDOWN */

.dropdown-title{
cursor:pointer;
user-select:none;
transition:.2s;
}

.dropdown-title:hover{
opacity:.7;
}

.dropdown-content{
max-height:0;
overflow:hidden;
transition:max-height .5s ease;
background-image:radial-gradient(circle at 1px 1px, rgb(227, 25, 123) 1px, transparent 0);
background-size:25px 25px;
animation:movePattern 40s linear infinite;
z-index:-1;
}

.dropdown-content.open{
max-height:10000px;

}

/* PORTFOLIO LAYOUT */

#portfolio{
margin-top:40px;
width:100%;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.column{
width:100%;
}

/* VIDEO GRID */

.videoWrapper{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
margin:15px 0;
}

</style>
</head>

/* RENDER FUNCTION */

function renderPortfolio(){

const leaguesColumn=document.getElementById("leaguesColumn")
const playersColumn=document.getElementById("playersColumn")

leaguesColumn.innerHTML=""
playersColumn.innerHTML=""

let openLeague=null
let openTeam=null
let openPlayer=null

/* LEAGUES */

for(let league in videoData.LEAGUES){

const leagueTitle=document.createElement("h2")
leagueTitle.textContent=league+" ▼"
leagueTitle.style.color="white"
leagueTitle.classList.add("dropdown-title")

const leagueContainer=document.createElement("div")
leagueContainer.classList.add("dropdown-content")

leaguesColumn.appendChild(leagueTitle)
leaguesColumn.appendChild(leagueContainer)

leagueTitle.onclick=()=>{

if(openLeague && openLeague!==leagueContainer){

openLeague.classList.remove("open")

}

leagueContainer.classList.toggle("open")
openLeague=leagueContainer

}

/* TEAMS */

for(let team in videoData.LEAGUES[league]){

const teamTitle=document.createElement("h3")
teamTitle.textContent=team+" ▶"
teamTitle.style.color="#4ade80"
teamTitle.classList.add("dropdown-title")

const teamContainer=document.createElement("div")
teamContainer.classList.add("dropdown-content")

leagueContainer.appendChild(teamTitle)
leagueContainer.appendChild(teamContainer)

teamTitle.onclick=()=>{

if(openTeam && openTeam!==teamContainer){

openTeam.classList.remove("open")

}

teamContainer.classList.toggle("open")
openTeam=teamContainer

}

const wrapper=document.createElement("div")
wrapper.className="videoWrapper"

videoData.LEAGUES[league][team].forEach(video=>{

const card=document.createElement("div")
card.className="card"

card.innerHTML=`
<div class="head">${video.title}</div>
<div class="content">
<video width="100%" controls preload="metadata">
<source src="${video.file}" type="video/mp4">
</video>
</div>
`

wrapper.appendChild(card)

})

teamContainer.appendChild(wrapper)

}

}

/* PLAYERS */

for(let group in videoData.PLAYERS){

const playerTitle=document.createElement("h2")
playerTitle.textContent=group+" ▼"
playerTitle.style.color="white"
playerTitle.classList.add("dropdown-title")

const playerContainer=document.createElement("div")

playersColumn.appendChild(playerTitle)
playersColumn.appendChild(playerContainer)

playerTitle.onclick=()=>{

if(openPlayer && openPlayer!==playerContainer){

openPlayer.classList.remove("open")

}

playerContainer.classList.toggle("open")
openPlayer=playerContainer

}

const wrapper=document.createElement("div")
wrapper.className="videoWrapper"

videoData.PLAYERS[group].forEach(video=>{

const card=document.createElement("div")

<div class="content">
<video width="100%" controls preload="metadata">
<source src="${video.file}" type="video/mp4">
</video>
</div>
`

wrapper.appendChild(card)

})

playerContainer.appendChild(wrapper)

}

}
